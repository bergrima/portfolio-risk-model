[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "portfolio-risk-model"
version = "0.1.0"
description = "A research-driven portfolio risk management framework."
requires-python = ">=3.12,<3.13"
dependencies = [
    "finpy-tse>=1.2.10",
    "pyarrow>=25.0.0",
    "pytse>=1.6.2",
    "pytse-client>=0.19.1",
]

[dependency-groups]
dev = [
    "pandas>=3.0.5",
    "pre-commit>=4.6.1",
    "pytest>=9.1.1",
    "ruff>=0.16.2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest]
minversion = "9.0"
testpaths = ["tests"]
addopts = [
    "-ra",
    "--import-mode=importlib"
]
markers = [
    "integration: tests that require external services",
]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"


[tool.pytest.ini_options]